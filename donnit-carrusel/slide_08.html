<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --green:#2D7A3A; --lightgreen:#EAF5EB; --dark:#1A1A1A; --red:#E53E3E; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .slide {
    width:1080px; height:1080px; position:relative; overflow:hidden; background:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:150px 100px 100px;
  }
  .logo { position:absolute; top:54px; left:54px; width:76px; height:76px; border-radius:50%;
    background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:48px; }
  .num { position:absolute; bottom:46px; right:60px; font-size:30px; font-weight:600; color:#cfcfcf; }
  .lead { font-size:46px; font-weight:600; color:var(--dark); line-height:1.25; max-width:820px; }
  .steps { margin-top:44px; display:flex; flex-direction:column; gap:20px; align-items:center; }
  .step { font-size:58px; font-weight:800; color:var(--green); letter-spacing:-0.5px; }
  .stores { margin-top:56px; display:flex; gap:26px; }
  .store {
    display:flex; align-items:center; gap:16px; background:#1A1A1A; color:#fff;
    padding:22px 40px; border-radius:20px;
  }
  .store .g { font-size:44px; }
  .store .t { text-align:left; line-height:1.05; }
  .store .t small { font-size:22px; font-weight:500; opacity:0.8; display:block; }
  .store .t b { font-size:38px; font-weight:800; }
  .handle {
    position:absolute; bottom:70px; font-size:40px; font-weight:800; color:var(--green);
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="logo">d</div>
    <div class="lead">La próxima vez que quieras deshacerte de algo:</div>
    <div class="steps">
      <div class="step">📸 Una foto</div>
      <div class="step">⏱️ 30 segundos</div>
      <div class="step">💚 Tu barrio lo rescata</div>
    </div>
    <div class="stores">
      <div class="store"><span class="g">🍏</span><span class="t"><small>Descárgala en</small><b>App Store</b></span></div>
      <div class="store"><span class="g">▶️</span><span class="t"><small>Disponible en</small><b>Google Play</b></span></div>
    </div>
    <div class="handle">@donnit.app</div>
    <div class="num">08 / 08</div>
  </div>
</body>
</html>
