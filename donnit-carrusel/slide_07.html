<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --green:#2D7A3A; --lightgreen:#EAF5EB; --dark:#1A1A1A; --red:#E53E3E; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .slide {
    width:1080px; height:1080px; position:relative; overflow:hidden;
    background:radial-gradient(120% 120% at 50% 20%, #2f8340 0%, #245f30 60%, #17441f 100%);
    display:flex; flex-direction:column; align-items:center; padding:130px 90px 90px; color:#fff;
  }
  .logo { position:absolute; top:54px; left:54px; width:76px; height:76px; border-radius:50%;
    background:#fff; color:var(--green); display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:48px; }
  .num { position:absolute; bottom:46px; right:60px; font-size:30px; font-weight:600; color:rgba(255,255,255,0.45); }
  h2 { font-size:62px; font-weight:800; text-align:center; letter-spacing:-0.5px; }
  .live { margin-top:16px; font-size:30px; font-weight:700; color:#bff0c4;
    display:flex; align-items:center; gap:12px; }
  .dot { width:16px; height:16px; border-radius:50%; background:#4ade80; box-shadow:0 0 0 6px rgba(74,222,128,0.25); }
  .map {
    margin-top:44px; width:100%; height:600px; border-radius:44px; position:relative; overflow:hidden;
    background:linear-gradient(160deg,#f4faf5 0%, #e6f4e8 100%);
    box-shadow:0 30px 80px rgba(0,0,0,0.3);
  }
  .street { position:absolute; background:#d4e7d7; border-radius:20px; }
  .h1s { height:26px; left:0; right:0; }
  .v1s { width:26px; top:0; bottom:0; }
  .pin {
    position:absolute; width:118px; height:118px; transform:translate(-50%,-100%);
    display:flex; align-items:center; justify-content:center;
  }
  .pin .bubble {
    width:104px; height:104px; border-radius:50% 50% 50% 8px; transform:rotate(45deg);
    background:var(--green); box-shadow:0 12px 26px rgba(23,68,31,0.35);
    display:flex; align-items:center; justify-content:center;
  }
  .pin .ico { transform:rotate(-45deg); font-size:54px; }
</style>
</head>
<body>
  <div class="slide">
    <div class="logo">d</div>
    <h2>Mientras tanto, en Donnit:</h2>
    <div class="live"><span class="dot"></span>Barcelona en tiempo real</div>
    <div class="map">
      <div class="street h1s" style="top:150px"></div>
      <div class="street h1s" style="top:330px"></div>
      <div class="street h1s" style="top:470px"></div>
      <div class="street v1s" style="left:230px"></div>
      <div class="street v1s" style="left:540px"></div>
      <div class="street v1s" style="left:820px"></div>
      <div class="pin" style="left:230px; top:200px"><div class="bubble"><span class="ico">🪑</span></div></div>
      <div class="pin" style="left:540px; top:180px"><div class="bubble"><span class="ico">📚</span></div></div>
      <div class="pin" style="left:820px; top:360px"><div class="bubble"><span class="ico">👕</span></div></div>
      <div class="pin" style="left:360px; top:500px"><div class="bubble"><span class="ico">💡</span></div></div>
      <div class="pin" style="left:660px; top:520px"><div class="bubble"><span class="ico">🛋️</span></div></div>
    </div>
    <div class="num">07 / 08</div>
  </div>
</body>
</html>
