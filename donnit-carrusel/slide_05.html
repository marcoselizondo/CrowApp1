<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --green:#2D7A3A; --lightgreen:#EAF5EB; --dark:#1A1A1A; --red:#E53E3E; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .slide {
    width:1080px; height:1080px; position:relative; overflow:hidden;
    background:var(--lightgreen);
    display:flex; flex-direction:column; align-items:center;
    padding:150px 90px 90px;
  }
  .logo { position:absolute; top:54px; left:54px; width:76px; height:76px; border-radius:50%;
    background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:48px; }
  .num { position:absolute; bottom:46px; right:60px; font-size:30px; font-weight:600; color:#b9c9bb; }
  .photo {
    width:100%; height:520px; border-radius:44px; background:#fff;
    display:flex; align-items:center; justify-content:center; position:relative;
    box-shadow:0 30px 70px rgba(29,74,43,0.14); border:3px dashed #cfe3d2;
  }
  .photo .emojis { font-size:260px; line-height:1; }
  .tag { position:absolute; top:22px; left:24px; font-size:24px; color:#9db8a2; font-weight:600; }
  .caption {
    margin-top:56px; font-size:52px; font-weight:800; line-height:1.22; color:var(--dark);
    text-align:center; letter-spacing:-0.5px;
  }
  .caption .hl { color:var(--green); }
</style>
</head>
<body>
  <div class="slide">
    <div class="logo">d</div>
    <div class="photo"><span class="tag">📷 foto</span><span class="emojis">📦📦</span></div>
    <div class="caption">💔 Comprar un mueble nuevo por no encontrar uno usado.<br><span class="hl">Había uno igual en tu barrio hace 3 días.</span></div>
    <div class="num">05 / 08</div>
  </div>
</body>
</html>
