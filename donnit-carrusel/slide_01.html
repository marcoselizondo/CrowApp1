<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --green: #2D7A3A;
    --lightgreen: #EAF5EB;
    --dark: #1A1A1A;
    --red: #E53E3E;
  }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .slide {
    width: 1080px; height: 1080px; position: relative; overflow: hidden;
    background: radial-gradient(120% 120% at 50% 30%, #2f8340 0%, #245f30 55%, #17441f 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; padding: 0 120px;
  }
  .logo {
    position: absolute; top: 54px; left: 54px;
    width: 76px; height: 76px; border-radius: 50%;
    background: #fff; color: var(--green);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 48px; line-height: 1;
  }
  .num { position: absolute; bottom: 46px; right: 60px; font-size: 30px; font-weight: 600; color: rgba(255,255,255,0.45); }
  .heart { font-size: 300px; line-height: 1; filter: drop-shadow(0 18px 40px rgba(0,0,0,0.35)); }
  h1 { font-size: 84px; font-weight: 800; line-height: 1.08; margin-top: 40px; letter-spacing: -1px; }
  h1 .brand { color: #bff0c4; }
  .sub {
    margin-top: 40px; font-size: 40px; font-weight: 500; color: rgba(255,255,255,0.82);
    background: rgba(255,255,255,0.10); padding: 18px 40px; border-radius: 999px;
    display: inline-block;
  }
</style>
</head>
<body>
  <div class="slide">
    <div class="logo">d</div>
    <div class="heart">💔</div>
    <h1>Cosas que nos parten<br>el alma en <span class="brand">Donnit</span></h1>
    <div class="sub">desliza si alguna vez lo has hecho →</div>
    <div class="num">01 / 08</div>
  </div>
</body>
</html>
