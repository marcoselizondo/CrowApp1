<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --green:#2D7A3A; --lightgreen:#EAF5EB; --dark:#1A1A1A; --red:#E53E3E; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .slide {
    width:1080px; height:1080px; position:relative; overflow:hidden;
    background:#fff;
    display:flex; flex-direction:column; align-items:center;
    padding:140px 90px 90px;
  }
  .logo { position:absolute; top:54px; left:54px; width:76px; height:76px; border-radius:50%;
    background:var(--green); color:#fff; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:48px; }
  .num { position:absolute; bottom:46px; right:60px; font-size:30px; font-weight:600; color:#cfcfcf; }
  .timer {
    background:var(--red); color:#fff; font-weight:800; font-size:34px;
    padding:16px 40px; border-radius:999px; margin-bottom:34px; letter-spacing:0.3px;
    box-shadow:0 14px 34px rgba(229,62,62,0.35);
  }
  .photo {
    width:100%; height:470px; border-radius:44px; background:#fff5f5;
    display:flex; align-items:center; justify-content:center; position:relative;
    box-shadow:0 30px 70px rgba(229,62,62,0.16); border:3px dashed #f3c4c4;
  }
  .photo .emojis { font-size:260px; line-height:1; }
  .tag { position:absolute; top:22px; left:24px; font-size:24px; color:#e29a9a; font-weight:600; }
  .caption {
    margin-top:46px; font-size:50px; font-weight:800; line-height:1.2; color:var(--dark);
    text-align:center; letter-spacing:-0.5px;
  }
  .caption .red { color:var(--red); }
</style>
</head>
<body>
  <div class="slide">
    <div class="logo">d</div>
    <div class="timer">⏱️ EL CAMIÓN LLEGA EN 20 MIN</div>
    <div class="photo"><span class="tag">📷 foto</span><span class="emojis">🪑🚛</span></div>
    <div class="caption">💔 Bajas una silla al contenedor porque ya no cabe.<br><span class="red">Quien la necesitaba estaba a 200 m.</span></div>
    <div class="num">04 / 08</div>
  </div>
</body>
</html>
